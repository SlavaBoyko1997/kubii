map $http_user_agent $blocked_abusive_crawler {
    default 0;
    ~*GPTBot 1;
}

map $http_user_agent $crawler_rate_key {
    default "";
    ~*(?:bot|crawler|spider|slurp) $binary_remote_addr;
}

map $http_user_agent $expensive_catalog_crawler {
    default 0;
    ~*(?:meta-externalagent|Amazonbot) 1;
}

map $args $has_filter_query {
    default 0;
    ~*(?:^|&)filter= 1;
}

map $uri $has_catalog_search_path {
    default 0;
    ~*/search/ 1;
}

map "$expensive_catalog_crawler:$has_filter_query:$has_catalog_search_path" $blocked_expensive_catalog_crawler {
    default 0;
    "1:1:0" 1;
    "1:0:1" 1;
    "1:1:1" 1;
}

limit_req_zone $crawler_rate_key zone=crawler_requests:10m rate=30r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name tripfish.com.ua;

    ssl_certificate /etc/letsencrypt/live/tripfish.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripfish.com.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 512M;

    if ($blocked_abusive_crawler) {
        return 403;
    }

    if ($blocked_expensive_catalog_crawler) {
        return 403;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        limit_req zone=crawler_requests burst=6 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /google-merchant-feed.xml {
        alias /var/www/html/storage/app/public/feeds/google-merchant-feed.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=300";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* ^/(build|storage|images|fonts)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    location ~* \.(?:woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Docker DNS: re-resolve "app" after container restarts (avoids stale IP → 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600s;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
