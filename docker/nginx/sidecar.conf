map $http_x_forwarded_proto $kubii_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $kubii_forwarded_proto $kubii_https {
    default off;
    https   on;
}

# Behind fishtrip TLS termination kubii listens on :80, so $server_port is 80.
# Laravel would then build https://host:80/... — force the public port from the scheme.
map $kubii_forwarded_proto $kubii_forwarded_port {
    default $server_port;
    https   443;
    http    80;
}

map $http_user_agent $kubii_blocked_bot {
    default 0;
    ~*(ClaudeBot|Claude-Web|anthropic-ai|GPTBot|CCBot|Bytespider|AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|GoogleOther|Reflectionbot|Amazonbot|meta-externalagent|DataForSeoBot|BLEXBot|serpstatbot|Barkrowler|ImagesiftBot|Timpibot|SeekportBot) 1;
}

map $http_user_agent $kubii_crawler {
    default '';
    ~*(bot|crawl|spider|slurp) $http_user_agent;
}

map $uri $kubii_filter_page {
    default 0;
    ~/search/ 1;
}

map $kubii_filter_page $kubii_filter_crawler_key {
    default '';
    1 $kubii_crawler;
}

# Blocked crawlers may still read robots.txt.
map "$kubii_blocked_bot:$uri" $kubii_deny_bot {
    default 0;
    "~^1:(?!/robots\.txt$)" 1;
}

limit_req_zone $kubii_filter_crawler_key zone=kubii_filter_crawlers:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    if ($kubii_deny_bot) {
        return 403;
    }

    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 512M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        limit_req zone=kubii_filter_crawlers burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; }

    location ~* ^/(build|storage|images|fonts)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600s;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $kubii_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $kubii_forwarded_port;
        fastcgi_param HTTPS $kubii_https;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
