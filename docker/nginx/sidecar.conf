map $http_x_forwarded_proto $kubii_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $kubii_forwarded_proto $kubii_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 512M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* ^/(build|storage|images|fonts)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600s;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $kubii_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
        fastcgi_param HTTPS $kubii_https;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
