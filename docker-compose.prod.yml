services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fishtrip-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
    volumes:
      - .:/var/www/html
      - ./docker/php/www-performance.conf:/usr/local/etc/php-fpm.d/zz-performance.conf:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/99-opcache.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - fishtrip

  nginx:
    image: nginx:1.27-alpine
    container_name: fishtrip-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - fishtrip

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fishtrip-queue
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
    command: ["su", "www-data", "-s", "/bin/sh", "-c", "php artisan queue:work redis --sleep=3 --tries=1 --timeout=3600 --memory=512 --queue=reviews,feeds,catalog-cache,default"]
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - fishtrip

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fishtrip-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6379
    command: ["sh", "-c", "while true; do su www-data -s /bin/sh -c 'php artisan schedule:run --verbose --no-interaction'; sleep 60; done"]
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - fishtrip

  mysql:
    image: mysql:8.4
    container_name: fishtrip-mysql
    restart: unless-stopped
    command: ["--skip-log-bin"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fishtrip}
      MYSQL_USER: ${DB_USERNAME:-fishtrip}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fishtrip}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - fishtrip

  redis:
    image: redis:7-alpine
    container_name: fishtrip-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fishtrip

  redis-cache:
    image: redis:7-alpine
    container_name: fishtrip-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fishtrip

networks:
  fishtrip:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
