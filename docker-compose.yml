services:
  mysql:
    image: mysql:8.4
    container_name: kubii-mysql
    restart: unless-stopped
    command: ["mysqld", "--skip-log-bin"]
    environment:
      MYSQL_DATABASE: kubii
      MYSQL_USER: kubii
      MYSQL_PASSWORD: kubii
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - kubii-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kubii-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - kubii-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kubii-mysql-data:
  kubii-redis-data:
